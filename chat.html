<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyBase チャット</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif; background: #f2f2f7; color: #1c1c1e; height: 100vh; display: flex; flex-direction: column; }

.header { background: #fff; border-bottom: 1px solid #e5e5ea; padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.header-icon { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #0071e3, #5856d6); display: flex; align-items: center; justify-content: center; font-size: 16px; }
.header-info { flex: 1; }
.header-name { font-size: 15px; font-weight: 600; }
.header-status { font-size: 12px; color: #34c759; }
.btn-admin-link { padding: 6px 12px; border-radius: 8px; border: 1px solid #c7c7cc; color: #6e6e73; font-size: 12px; background: #fff; cursor: pointer; text-decoration: none; }

.thread-select-bar { background: #fff; border-bottom: 1px solid #e5e5ea; padding: 10px 16px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.thread-select-label { font-size: 12px; color: #6e6e73; white-space: nowrap; }
.thread-select { flex: 1; border: 1px solid #c7c7cc; border-radius: 8px; padding: 6px 10px; font-size: 13px; background: #f9f9f9; outline: none; }

.disclaimer { background: #fff8e6; border-bottom: 1px solid #f0d080; padding: 8px 16px; font-size: 12px; color: #7a5c00; line-height: 1.5; flex-shrink: 0; }

.messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }

.empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #8e8e93; text-align: center; gap: 8px; }
.empty-state .icon { font-size: 40px; }
.empty-state .title { font-size: 16px; font-weight: 600; color: #3c3c43; }
.empty-state .sub { font-size: 13px; }

/* ステップUI */
.step-card { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.step-label { font-size: 12px; color: #6e6e73; font-weight: 600; letter-spacing: 0.05em; margin-bottom: 8px; }
.step-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; }
.btn-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.btn-option { padding: 10px 16px; border-radius: 20px; border: 1.5px solid #0071e3; color: #0071e3; font-size: 14px; font-weight: 500; background: #fff; cursor: pointer; transition: all 0.15s; }
.btn-option:hover { background: #e8f0fe; }
.btn-option.selected { background: #0071e3; color: #fff; }
.btn-option:disabled { opacity: 0.4; cursor: default; }

/* 選択済みバッジ */
.selection-badge { display: inline-flex; align-items: center; gap: 6px; background: #e8f0fe; color: #0071e3; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 12px; margin-bottom: 4px; }

/* 資料カード */
.doc-card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.doc-card-header { padding: 16px 20px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; gap: 10px; }
.doc-card-icon { font-size: 20px; }
.doc-card-title { font-size: 14px; font-weight: 600; }
.doc-card-sub { font-size: 12px; color: #8e8e93; margin-top: 2px; }
.doc-card-body { padding: 16px; }
.doc-ref-text { font-size: 14px; color: #3c3c43; margin-bottom: 14px; line-height: 1.6; }
.page-images { display: flex; flex-direction: column; gap: 10px; }
.page-img { width: 100%; border-radius: 10px; border: 1px solid #e5e5ea; cursor: pointer; transition: opacity 0.2s; display: block; }
.page-img:hover { opacity: 0.9; }
.loading-text { color: #8e8e93; font-size: 13px; padding: 16px 0; text-align: center; }

.btn-reset { display: block; width: 100%; padding: 12px; border-radius: 10px; border: 1.5px solid #c7c7cc; background: #fff; font-size: 14px; color: #3c3c43; cursor: pointer; margin-top: 8px; font-weight: 500; }
.btn-reset:hover { background: #f5f5f7; }

/* 画像拡大モーダル */
.img-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
.img-modal.show { opacity: 1; pointer-events: all; }
.img-modal img { max-width: 92vw; max-height: 92vh; border-radius: 8px; }
.img-modal-close { position: absolute; top: 16px; right: 20px; color: #fff; font-size: 28px; cursor: pointer; }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">🤖</div>
  <div class="header-info">
    <div class="header-name" id="headerName">AIサポート</div>
    <div class="header-status">● オンライン</div>
  </div>
  <a class="btn-admin-link" href="admin.html">⚙ 管理画面</a>
</div>

<div class="thread-select-bar">
  <span class="thread-select-label">スレッド：</span>
  <select class="thread-select" id="threadSelect" onchange="selectThread()">
    <option value="">選択してください</option>
  </select>
</div>

<div class="disclaimer" id="disclaimer" style="display:none">
  ⚠️ 表示内容は資料に基づいています。重要な内容は必ず資料原本またはスタッフへご確認ください。
</div>

<div class="messages" id="messages">
  <div class="empty-state" id="emptyState">
    <div class="icon">💬</div>
    <div class="title">スレッドを選択してください</div>
    <div class="sub">上のメニューからスレッドを選ぶと<br>案内が始まります</div>
  </div>
</div>

<div class="img-modal" id="imgModal" onclick="closeImgModal()">
  <span class="img-modal-close">✕</span>
  <img id="imgModalImg" src="" alt="">
</div>

<script>
const API = '';
let currentThread = null;

async function loadThreads() {
  const res = await fetch(API + '/api/threads');
  const threads = await res.json();
  const sel = document.getElementById('threadSelect');
  sel.innerHTML = '<option value="">選択してください</option>' +
    threads.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
}

async function selectThread() {
  const sel = document.getElementById('threadSelect');
  const id = sel.value;
  const name = sel.options[sel.selectedIndex].text;
  if (!id) {
    document.getElementById('disclaimer').style.display = 'none';
    document.getElementById('emptyState').style.display = '';
    return;
  }
  currentThread = id;
  document.getElementById('headerName').textContent = name;
  document.getElementById('disclaimer').style.display = '';
  document.getElementById('emptyState').style.display = 'none';
  showCourseStep();
}

// ----------------------------------------
// Step 1: コース選択
// ----------------------------------------
async function showCourseStep() {
  const messages = document.getElementById('messages');
  messages.innerHTML = '';

  const res = await fetch(`${API}/api/options?threadId=${currentThread}`);
  const { courses, gradesByCourse } = await res.json();

  if (courses.length === 0) {
    messages.innerHTML = '<div style="color:#8e8e93;text-align:center;padding:32px;font-size:14px">資料が登録されていません</div>';
    return;
  }

  const card = document.createElement('div');
  card.className = 'step-card';
  card.innerHTML = `
    <div class="step-label">STEP 1</div>
    <div class="step-title">コースを選択してください</div>
    <div class="btn-grid" id="courseGrid">
      ${courses.map(c => `<button class="btn-option" onclick="selectCourse('${escAttr(c)}')">${esc(c)}</button>`).join('')}
    </div>
  `;
  messages.appendChild(card);
  scrollBottom();

  // gradesByCourseをグローバルに保存
  window._gradesByCourse = gradesByCourse;
}

// ----------------------------------------
// Step 2: 学年選択
// ----------------------------------------
function selectCourse(course) {
  // コースボタンを選択済みに
  document.querySelectorAll('#courseGrid .btn-option').forEach(b => {
    b.disabled = true;
    if (b.textContent === course) b.classList.add('selected');
  });

  const grades = window._gradesByCourse[course] || [];
  const messages = document.getElementById('messages');

  const card = document.createElement('div');
  card.className = 'step-card';
  card.innerHTML = `
    <div class="selection-badge">📚 ${esc(course)}</div>
    <div class="step-label" style="margin-top:12px">STEP 2</div>
    <div class="step-title">学年を選択してください</div>
    <div class="btn-grid" id="gradeGrid">
      ${grades.map(g => `<button class="btn-option" onclick="selectGrade('${escAttr(course)}','${escAttr(g)}')">${esc(g)}</button>`).join('')}
    </div>
  `;
  messages.appendChild(card);
  scrollBottom();
}

// ----------------------------------------
// Step 3: 資料表示
// ----------------------------------------
async function selectGrade(course, grade) {
  // 学年ボタンを選択済みに
  document.querySelectorAll('#gradeGrid .btn-option').forEach(b => {
    b.disabled = true;
    if (b.textContent === grade) b.classList.add('selected');
  });

  const messages = document.getElementById('messages');

  // ローディング
  const loadCard = document.createElement('div');
  loadCard.className = 'doc-card';
  loadCard.innerHTML = `
    <div class="doc-card-header">
      <span class="doc-card-icon">📄</span>
      <div>
        <div class="doc-card-title">${esc(course)} ${esc(grade)}</div>
        <div class="doc-card-sub">資料を読み込み中...</div>
      </div>
    </div>
    <div class="doc-card-body">
      <div class="loading-text">📷 ページ画像を読み込んでいます...</div>
    </div>
  `;
  messages.appendChild(loadCard);
  scrollBottom();

  try {
    // ファイル検索
    const findRes = await fetch(`${API}/api/find-doc?threadId=${currentThread}&course=${encodeURIComponent(course)}&grade=${encodeURIComponent(grade)}`);
    if (!findRes.ok) {
      loadCard.querySelector('.doc-card-body').innerHTML = '<div class="loading-text">⚠️ 該当する資料が見つかりませんでした。</div>';
      return;
    }
    const { docId, docName, pageCount } = await findRes.json();

    // 全ページ画像取得
    const imgRes = await fetch(`${API}/api/all-page-images/${docId}`);
    const { urls } = await imgRes.json();

    loadCard.querySelector('.doc-card-title').textContent = docName.replace(/\.pdf$/i, '');
    loadCard.querySelector('.doc-card-sub').textContent = `全${urls.length}ページ`;
    loadCard.querySelector('.doc-card-body').innerHTML = `
      <div class="doc-ref-text">📋 こちらの資料をご参照ください。</div>
      <div class="page-images" id="pageImages_${docId}">
        ${urls.map((url, i) => `<img class="page-img" src="${url}" alt="${i+1}ページ" onclick="openImgModal('${url}')" loading="lazy">`).join('')}
      </div>
    `;

    // 最初に戻るボタン
    const resetBtn = document.createElement('button');
    resetBtn.className = 'btn-reset';
    resetBtn.textContent = '🔄 最初から選び直す';
    resetBtn.onclick = showCourseStep;
    messages.appendChild(resetBtn);

  } catch(e) {
    loadCard.querySelector('.doc-card-body').innerHTML = `<div class="loading-text">⚠️ エラーが発生しました: ${e.message}</div>`;
  }

  scrollBottom();
}

function openImgModal(url) {
  document.getElementById('imgModalImg').src = url;
  document.getElementById('imgModal').classList.add('show');
}
function closeImgModal() {
  document.getElementById('imgModal').classList.remove('show');
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) {
  return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;');
}
function scrollBottom() {
  const m = document.getElementById('messages');
  setTimeout(() => m.scrollTop = m.scrollHeight, 50);
}

loadThreads();
</script>
</body>
</html>
